name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: node security/dependency-source-policy.mjs
      - run: npm ci
      - run: npm run quality
      - run: npm run audit:policy
      - run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - run: python -m pip install detect-secrets==1.5.0
      - name: Detect committed secrets
        shell: bash
        run: |
          # The generated briefing carries a public SHA-256 integrity value, not a credential.
          # Keep every detector enabled while narrowly exempting that typed JSON field.
          git ls-files -z | xargs -0 detect-secrets-hook \
            --exclude-lines '^\s*"contentHash"\s*:\s*"[0-9a-f]{64}"\s*,?\s*$'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Responsive interaction gate
        shell: bash
        run: |
          npm run start > /tmp/atlas-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/ > /dev/null
          npm run test:ui
